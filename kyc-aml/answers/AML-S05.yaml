    by the prior closure (C04). POL-5001 directs closure of the current activity and no re-opening
    of the earlier matter.
  disposition_expected: 'close: the transfers under review are documented by a facility executed
    before them'
  epistemic_scope: A reviewer could reasonably request the 2025 documentation while closing
    the current alert. Treating the prior closure as having settled the 2025 position would
    not be supported.
