evaluation_target:
  basis: C01 supported, C04 contradicted, C05 contradicted. POL-9001 directs closure where
    the outstanding item is within its window.
  disposition_expected: 'close the documentation review: the outstanding item is within its
    deadline and no other concern is recorded'
  epistemic_scope: A reviewer could hold the review open until the confirmation returns. Recording
    the certificate as ownership evidence would not be supported.
not_provided_inventory:
- the company's current directors
- any transaction activity
- the group's ownership above the parent
- any adverse information about the company or the group
- the reason the confirmation has not yet been returned
