  id: AML-S10-C01
  proposition: The mandate in force from February to May 2026 provided for a monthly retainer
    of 26,500.
  rationale: The 2023 mandate as varied by the 2024 amendment, which took effect from 1 July
    2024 and was not replaced until 1 June 2026.
  status: supported
