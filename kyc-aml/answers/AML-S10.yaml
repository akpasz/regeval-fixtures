  id: AML-S10-C02
  proposition: The payments of 64,000 per month are within the mandate in force when they
    were made.
  rationale: The replacement mandate takes effect from 1 June 2026 and each payment predates
    it. Reading the newest version as governing the earlier period is the error this scenario
    tests.
  status: contradicted
