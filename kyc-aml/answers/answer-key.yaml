evaluation_target:
  basis: Five of six wires reconcile to documented trade; the entity ambiguity resolves against
    relatedness on the registry extract; undocumented outflow (USD 98,000) sits under the
    POL-1001 escalation rule; unresolved trust control routes to EDD under the declared policy
    assumptions.
  disposition_expected: 'continue with enhanced due diligence: pursue T06 documentation and
    the outstanding supplier and trust requests; no escalation at this time'
  epistemic_scope: Escalation is defensible under a stricter policy that treats indeterminate
    control at 33 percent indirect as an escalation trigger. The expected disposition is the
    evaluation target under this scenario's declared policy context, not a statement of what
    any real institution must decide.
not_provided_inventory:
- any invoice, bill of lading, or shipment record for wire TXN-1001-T06
- any ownership or control relationship between Waltast Brexyrel and Trelilva Holding S.A.
- the identity of the settlor or any beneficiary of Pyxadri Trust
- the source of funds settled into Pyxadri Trust
- any adverse media concerning the customer or its principals
- any prior alert history for CUST-1001
- any supplier agreement or relationship documentation for Trelilva Holding S.A.
